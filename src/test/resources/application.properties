# Test configuration: H2 in-memory. This file shadows src/main/resources/application.properties
# on the test classpath, so everything tests need is repeated here.

spring.datasource.url=jdbc:h2:mem:stubu-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Same migrations as production; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

logging.level.org.atmosphere=warn
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.stubu.specdriven
