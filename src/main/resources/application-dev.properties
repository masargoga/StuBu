# Local development profile: H2 in-memory instead of PostgreSQL, seeded with sample employees.
# Run with: ./mvnw -Dspring-boot.run.profiles=dev
# To sign in locally, use the test-scoped launcher (mock identity provider):
#   ./mvnw spring-boot:test-run -Dspring-boot.run.profiles=dev

spring.datasource.url=jdbc:h2:mem:stubu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Sample employees (db/dev/R__dev_seed_data.sql) on top of the regular migrations.
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Plain http://localhost
server.servlet.session.cookie.secure=false
