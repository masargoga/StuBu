server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.stubu.specdriven

# --- Persistence (production: PostgreSQL) ---
# Override with SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
# No credentials belong in this file.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stubu}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Health and shutdown (Docker, Kubernetes) ---
# Only the health probes are exposed, without details and without sign-in:
#   /actuator/health/liveness   the process is running and not stuck
#   /actuator/health/readiness  the application can serve requests (the database answers)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
# On shutdown (a pod is replaced) finish the running requests before stopping.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Session and proxy handling ---
# Session cookie: not readable by scripts, sent on the redirect back from the IAM provider (Lax),
# and only over HTTPS in production (the dev profile relaxes this for plain http://localhost).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# Behind a Kubernetes ingress / reverse proxy, build redirect URIs from the forwarded headers.
server.forward-headers-strategy=framework

# --- IAM providers (OIDC) ---
# Providers are only offered on the login page when a client id is set. Secrets come from the environment:
#   STUBU_IAM_PROVIDERS_GOOGLE_CLIENTID / STUBU_IAM_PROVIDERS_GOOGLE_CLIENTSECRET
#   STUBU_IAM_PROVIDERS_MICROSOFT_TENANTID / _CLIENTID / _CLIENTSECRET
# Redirect URI to register with the provider: {base-url}/login/oauth2/code/{google|microsoft}

# --- Time tracking ---
# How often the time tracking panel reloads itself while a page is open (ISO-8601 duration).
stubu.time-tracking.refresh-interval=PT30S

# --- Data retention ---
# How long time records are kept (ISO-8601 period, default P1Y = one year). Nothing is deleted automatically:
# the value only tells which records are beyond the period, until business and legal have decided how to remove them.
stubu.retention.time-records=${STUBU_RETENTION_TIME_RECORDS:P1Y}

# --- Email notifications ---
# Managers are emailed when a timesheet is submitted. Without spring.mail.host nothing is sent (it is logged).
# Server settings come from the environment, e.g. SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD; no credentials belong in this file.
stubu.notifications.from=${STUBU_NOTIFICATIONS_FROM:noreply@stubu.local}
# Language (en or de) and time zone used in the email texts.
stubu.notifications.locale=en
stubu.notifications.zone=UTC

# --- Security ---
# How often a signed-in employee is checked against the employee record (still active, same role). A
# deactivated employee or a role change takes effect after at most this long (ISO-8601 duration).
stubu.security.recheck-interval=PT5S
