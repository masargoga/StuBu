apiVersion: apps/v1
kind: Deployment
metadata:
  name: stubu
  labels:
    app.kubernetes.io/name: stubu
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stubu
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stubu
    spec:
      # Longer than spring.lifecycle.timeout-per-shutdown-phase (30s) plus the preStop wait.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The same number as the user in the Dockerfile (Kubernetes cannot verify a user name).
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stubu
          image: registry.example.com/stubu:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: stubu-config
            # Database password, OIDC client secrets, mail password: see examples/secret.example.yaml.
            - secretRef:
                name: stubu-secrets
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              # Give the ingress time to stop sending requests before the graceful shutdown starts.
              exec:
                command: ["sleep", "10"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        # The application keeps no state on disk; the temp directory is all it writes to.
        - name: tmp
          emptyDir: {}
