# Test profile (activate with @ActiveProfiles("test")): H2 in-memory, same Flyway migrations as production.

spring.datasource.url=jdbc:h2:mem:stubu-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Plain http on localhost
server.servlet.session.cookie.secure=false

# The real providers are offered on the login page; their endpoints are never called from tests.
stubu.iam.providers.google.client-id=test-google-client
stubu.iam.providers.google.client-secret=test-google-secret
stubu.iam.providers.microsoft.tenant-id=test-tenant
stubu.iam.providers.microsoft.client-id=test-microsoft-client
stubu.iam.providers.microsoft.client-secret=test-microsoft-secret

# Short, so browser tests can see the panel refresh itself.
stubu.time-tracking.refresh-interval=PT3S
