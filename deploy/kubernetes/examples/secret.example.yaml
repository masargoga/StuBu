# EXAMPLE ONLY. Never commit real values. Create the secret in the cluster instead, for example:
#
#   kubectl create secret generic stubu-secrets \
#     --from-literal=SPRING_DATASOURCE_USERNAME=stubu \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='...' \
#     --from-literal=STUBU_IAM_PROVIDERS_MICROSOFT_CLIENTSECRET='...' \
#     --from-literal=SPRING_MAIL_PASSWORD='...'
#
# or use your secret manager (External Secrets, Sealed Secrets, Vault) to produce a secret with this name.
apiVersion: v1
kind: Secret
metadata:
  name: stubu-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "REPLACE_ME"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
  STUBU_IAM_PROVIDERS_MICROSOFT_CLIENTSECRET: "REPLACE_ME"
  # Only when emails are sent (see also SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME in the ConfigMap).
  SPRING_MAIL_PASSWORD: "REPLACE_ME"
